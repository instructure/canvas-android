query GradesUnreadCommentCountsQuery($courseId: ID!, $studentId: ID!, $pageSize: Int!, $submissionCursor: String) {
    course(id: $courseId) {
        submissionsConnection(
            first: $pageSize
            after: $submissionCursor
            studentIds: [$studentId]
        ) {
            pageInfo {
                hasNextPage
                endCursor
            }
            nodes {
                _id
                unreadCommentCount
                assignment {
                    _id
                }
            }
        }
    }
}