gcloud:
  project: delta-essence-114723
  # Use the next two lines to run locally
  #  app: ./build/outputs/apk/qa/debug/student-qa-debug.apk
  #  test: ./build/outputs/apk/androidTest/qa/debug/student-qa-debug-androidTest.apk
  app: ./apps/parent/build/outputs/apk/qa/debug/parent-qa-debug.apk
  test: ./apps/parent/build/outputs/apk/androidTest/qa/debug/parent-qa-debug-androidTest.apk
  results-bucket: android-parent
  auto-google-login: true
  use-orchestrator: true
  performance-metrics: false
  record-video: false
  timeout: 60m
  num-flaky-test-attempts: 1
  environment-variables:
    timeout_msec: 600000
  test-targets:
    - annotation com.instructure.canvas.espresso.annotations.E2E
    - notAnnotation com.instructure.canvas.espresso.annotations.Stub, com.instructure.canvas.espresso.annotations.FlakyE2E, com.instructure.canvas.espresso.annotations.KnownBug, com.instructure.canvas.espresso.annotations.OfflineE2E, com.instructure.canvas.espresso.annotations.ReleaseExclude
  device:
    - model: MediumPhone.arm
      version: 34
      locale: en_US
      orientation: portrait

flank:
  testShards: 10
  testRuns: 1
