name: Release Parent

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - 'release/parent'

concurrency:
  group: release-parent-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/reusable-release-pipeline.yml
    with:
      app-name: parent
      app-display-name: Parent
      include-e2e-offline: false
      slack-emoji: ':parent-app:'
    secrets: inherit