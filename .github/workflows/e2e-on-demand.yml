name: E2E Tests (On-Demand)

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to run e2e tests against'
        required: true
        type: choice
        options:
          - parent
          - student
          - teacher
      record_video:
        description: 'Enable FTL video recording (for investigation reruns)'
        required: false
        type: boolean
        default: false

run-name: E2E ${{ inputs.app }} @ ${{ github.ref_name }}

jobs:
  test-apks:
    uses: ./.github/workflows/build-test-apks.yml
    with:
      app-type-lower: ${{ inputs.app }}
    secrets: inherit

  e2e-tests:
    needs: test-apks
    uses: ./.github/workflows/e2e-app.yml
    with:
      app-type-lower: ${{ inputs.app }}
      record_video: ${{ inputs.record_video }}
    secrets: inherit

  slack-notification:
    if: ${{ !cancelled() && needs.e2e-tests.result != 'cancelled' }}
    needs: e2e-tests
    uses: ./.github/workflows/slack-notify-e2e.yml
    with:
      app-display-name: Android Canvas - ${{ inputs.app == 'parent' && 'Parent' || inputs.app == 'student' && 'Student' || 'Teacher' }}
      channel: github_android_test_${{ inputs.app }}
      e2e-result: ${{ needs.e2e-tests.result }}
      matrix-url: ${{ needs.e2e-tests.outputs.matrix-url }}
      workflow-name: ${{ github.workflow }}
    secrets: inherit
