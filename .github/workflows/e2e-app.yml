name: E2E App

on:
  workflow_call:
    inputs:
      app-type-lower:
        description: 'App type in lowercase (parent, student, or teacher)'
        required: true
        type: string
      flank-config:
        description: 'Flank config file under apps/<app>/ (e.g. flank_e2e.yml, flank_e2e_offline.yml)'
        required: false
        type: string
        default: 'flank_e2e.yml'
      record_video:
        description: 'Enable FTL video recording (scheduled E2E runs pass true; PR/on-demand default false)'
        required: false
        type: boolean
        default: false
    outputs:
      matrix-url:
        description: 'Firebase Test Matrix URL for the run (empty if Flank produced no matrix link)'
        value: ${{ jobs.e2e-tests.outputs.matrix-url }}
    secrets:
      GCLOUD_KEY:
        required: true
      SPLUNK_MOBILE_TOKEN:
        required: false
      OBSERVE_MOBILE_TOKEN:
        required: false

jobs:
  e2e-tests:
    name: ${{ inputs.app-type-lower }}-e2e-tests
    runs-on: ubuntu-latest-16core
    outputs:
      matrix-url: ${{ steps.capture-matrix-url.outputs.url }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --quiet defusedxml

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Setup Service account
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.GCLOUD_KEY }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_KEY}" ]; then
            echo "Error: GCLOUD_KEY secret is not set"
            exit 1
          fi
          echo "${FIREBASE_SERVICE_ACCOUNT_KEY}" > service-account-key.json
          chmod 600 service-account-key.json

      - name: Setup Flank config
        env:
          APP: ${{ inputs.app-type-lower }}
          FLANK_CONFIG: ${{ inputs.flank-config }}
          RECORD_VIDEO: ${{ inputs.record_video }}
        run: |
          case "$FLANK_CONFIG" in
            flank_e2e.yml|flank_e2e_offline.yml) ;;
            *) echo "Unsupported flank-config: $FLANK_CONFIG"; exit 1 ;;
          esac
          case "$APP" in
            parent|student|teacher) ;;
            *) echo "Unsupported app: $APP"; exit 1 ;;
          esac
          cp "./apps/$APP/$FLANK_CONFIG" ./flank.yml
          if [ "$RECORD_VIDEO" = "true" ]; then
            sed -i 's/^  record-video:.*/  record-video: true/' ./flank.yml
            echo "Video recording enabled for this run"
          fi

      - name: Copy APKs to expected locations
        env:
          APP: ${{ inputs.app-type-lower }}
        run: |
          if [ -d "${APP}-qa-debug.apk" ]; then
             mkdir -p "apps/${APP}/build/outputs/apk/qa/debug"
             mv "${APP}-qa-debug.apk/${APP}-qa-debug.apk" "apps/${APP}/build/outputs/apk/qa/debug/"
             rm -rf "${APP}-qa-debug.apk"
          fi
          if [ -d "${APP}-qa-debug-androidTest.apk" ]; then
             mkdir -p "apps/${APP}/build/outputs/apk/androidTest/qa/debug"
             mv "${APP}-qa-debug-androidTest.apk/${APP}-qa-debug-androidTest.apk" "apps/${APP}/build/outputs/apk/androidTest/qa/debug/"
             rm -rf "${APP}-qa-debug-androidTest.apk"
          fi

      - name: Download Flank
        run: curl -fL -o flank.jar https://github.com/Flank/flank/releases/download/v23.07.0/flank.jar

      - name: Run Flank E2E tests (initial)
        id: flank_initial
        continue-on-error: true
        run: |
          set -o pipefail
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml 2>&1 | tee flank-initial.log
          flank_exit=${PIPESTATUS[0]}
          # Flank v23.07.0 has been observed to exit 0 even when test cases within
          # a matrix fail. Grep the log for the failure marker as a backstop.
          if grep -qE '[1-9][0-9]* matri(x|ces) failed' flank-initial.log; then
            echo "::warning::Flank reported matrix failures despite exit code"
            exit 1
          fi
          exit "$flank_exit"

      - name: Detect failed tests for scoped rerun
        id: detect
        if: always()
        run: |
          if [ ! -d results ]; then
            echo "rerun=none" >> $GITHUB_OUTPUT
            echo "No results dir — Flank likely failed before any execution."
            exit 0
          fi
          python3 scripts/flank/detect_rerun.py results > rerun-tests.txt || true
          if [ ! -s rerun-tests.txt ]; then
            # JUnit shows no failures — but check the log backstop for the Flank exit-0 bug.
            if grep -qE '[1-9][0-9]* matri(x|ces) failed' flank-initial.log 2>/dev/null; then
              echo "rerun=full" >> $GITHUB_OUTPUT
              echo "Log reports failures not visible in JUnit; full rerun."
            else
              echo "rerun=none" >> $GITHUB_OUTPUT
              echo "No failures detected."
            fi
          elif grep -q '__MISSING_SHARDS__' rerun-tests.txt; then
            echo "rerun=full" >> $GITHUB_OUTPUT
            echo "Missing shard(s) detected — full-suite rerun."
          else
            echo "rerun=scoped" >> $GITHUB_OUTPUT
            echo "Tests to rerun:"
            cat rerun-tests.txt
          fi

      - name: Move initial results aside
        if: steps.detect.outputs.rerun == 'scoped' || steps.detect.outputs.rerun == 'full'
        run: mv results results-initial

      - name: Build scoped rerun config
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          pip install --quiet pyyaml
          python3 scripts/flank/build_rerun_flank.py ./flank.yml rerun-tests.txt > flank-rerun.yml

      - name: Rerun (scoped to failed tests)
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          set -o pipefail
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank-rerun.yml 2>&1 | tee flank-rerun.log

      - name: Rerun (full suite — missing-shards/log fallback)
        if: steps.detect.outputs.rerun == 'full'
        run: |
          set -o pipefail
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml 2>&1 | tee flank-rerun.log

      - name: Capture Firebase Test Matrix URL
        id: capture-matrix-url
        if: always()
        run: |
          url=""
          for log in flank-rerun.log flank-initial.log; do
            if [ -f "$log" ]; then
              url=$(grep -oE 'https://console\.firebase\.google\.com/project/[^/]+/testlab/histories/[^/]+/matrices/[a-zA-Z0-9_-]+' "$log" | head -1 || true)
              if [ -n "$url" ]; then break; fi
            fi
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Report initial results to Splunk
        if: always() && (steps.detect.outputs.rerun == 'scoped' || steps.detect.outputs.rerun == 'full')
        env:
          APP: ${{ inputs.app-type-lower }}
          SPLUNK_MOBILE_TOKEN: ${{ secrets.SPLUNK_MOBILE_TOKEN }}
          OBSERVE_MOBILE_TOKEN: ${{ secrets.OBSERVE_MOBILE_TOKEN }}
          BITRISE_TRIGGERED_WORKFLOW_ID: ${{ github.workflow }}
          BITRISE_GIT_BRANCH: ${{ github.ref_name }}
          BITRISE_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -d results-initial ] && [ -n "$(ls -A results-initial 2>/dev/null)" ]; then
            ./apps/postProcessTestRun.bash "$APP" "results-initial/$(ls results-initial)"
          fi

      - name: Report final results to Splunk
        if: always() && hashFiles('results/**/JUnitReport.xml') != ''
        env:
          APP: ${{ inputs.app-type-lower }}
          SPLUNK_MOBILE_TOKEN: ${{ secrets.SPLUNK_MOBILE_TOKEN }}
          OBSERVE_MOBILE_TOKEN: ${{ secrets.OBSERVE_MOBILE_TOKEN }}
          BITRISE_TRIGGERED_WORKFLOW_ID: ${{ github.workflow }}
          BITRISE_GIT_BRANCH: ${{ github.ref_name }}
          BITRISE_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./apps/postProcessTestRun.bash "$APP" "results/$(ls results)"

      - name: Determine final outcome
        if: always() && (steps.flank_initial.outcome == 'failure' || steps.detect.outputs.rerun != 'none')
        run: |
          rerun="${{ steps.detect.outputs.rerun }}"
          initial_outcome="${{ steps.flank_initial.outcome }}"
          if [ "$rerun" = "none" ] && [ "$initial_outcome" = "failure" ]; then
            echo "::error::Initial run failed but no rerun candidates identified."
            exit 1
          fi
          if [ "$rerun" = "scoped" ] || [ "$rerun" = "full" ]; then
            python3 scripts/flank/detect_rerun.py results > final-fails.txt || true
            if [ -s final-fails.txt ]; then
              echo "::error::Tests still failing after rerun:"
              cat final-fails.txt
              exit 1
            fi
            # Final backstop: rerun log says failures
            if grep -qE '[1-9][0-9]* matri(x|ces) failed' flank-rerun.log 2>/dev/null; then
              echo "::error::Rerun log reports failures."
              exit 1
            fi
            echo "Rerun recovered the suite."
          fi

      - name: Cleanup sensitive files
        if: always()
        run: rm -f service-account-key.json
