          mkdir -p libs/pandautils
          mv pandautils-test.apk libs/pandautils/
          mv pandautils-app.apk libs/pandautils/

      - name: Download Flank
        run: curl -fL -o flank.jar https://github.com/Flank/flank/releases/download/v23.07.0/flank.jar

      - name: Run Flank submodule UI tests (initial)
        id: flank_initial
        continue-on-error: true
        run: |
          set -o pipefail
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml 2>&1 | tee flank-initial.log
          flank_exit=${PIPESTATUS[0]}
          # Flank v23.07.0 sometimes exits 0 even when matrices fail. Backstop on the log.
          if grep -qE '[1-9][0-9]* matri(x|ces) failed' flank-initial.log; then
            echo "::warning::Flank reported matrix failures despite exit code"
            exit 1
          fi
          exit "$flank_exit"

      - name: Detect failed tests for scoped rerun
        id: detect
        if: steps.flank_initial.outcome == 'failure'
        run: |
          python3 scripts/flank/detect_rerun.py results > rerun-tests.txt || true
          if [ ! -s rerun-tests.txt ]; then
            echo "rerun=none" >> $GITHUB_OUTPUT
          elif grep -q '__MISSING_SHARDS__' rerun-tests.txt; then
            echo "rerun=full" >> $GITHUB_OUTPUT
          else
            echo "rerun=scoped" >> $GITHUB_OUTPUT
            cat rerun-tests.txt
          fi

      - name: Move initial results aside
        if: steps.detect.outputs.rerun == 'scoped' || steps.detect.outputs.rerun == 'full'
        run: mv results results-initial

      - name: Build scoped rerun config
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          pip install --quiet pyyaml
          python3 scripts/flank/build_rerun_flank.py ./flank.yml rerun-tests.txt > flank-rerun.yml

      - name: Rerun (scoped to failed tests)
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank-rerun.yml

      - name: Rerun (full suite — missing-shards fallback)
        if: steps.detect.outputs.rerun == 'full'
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml

      - name: Determine final outcome
        if: always() && steps.flank_initial.outcome == 'failure'
        run: |
          rerun="${{ steps.detect.outputs.rerun }}"
          if [ -z "$rerun" ] || [ "$rerun" = "none" ]; then
            echo "Initial run failed and no rerun was attempted."
            exit 1
          fi
          python3 scripts/flank/detect_rerun.py results > final-fails.txt || true
          if [ -s final-fails.txt ]; then
            echo "Tests still failing after rerun:"
            cat final-fails.txt
            exit 1
          fi
  unit-test-report:
    name: unit-test-report
    runs-on: ubuntu-latest-16core
    if: always()
    needs: [parent-unit-tests, student-unit-tests, teacher-unit-tests, horizon-unit-tests, ngc-unit-tests, instui-unit-tests, submodule-unit-tests]
    permissions:
      pull-requests: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: test-results/

      - name: Parse test results and generate report
        id: parse
        run: |
          cat > parse_tests.py <<'PYTHON_SCRIPT'
          import os
          import re
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          class TestReportParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_value = False
                  self.current_id = None
                  self.data = {}

              def handle_starttag(self, tag, attrs):
                  attrs_dict = dict(attrs)
                  if tag == 'div' and 'infoBox' in attrs_dict.get('class', ''):
                      self.current_id = attrs_dict.get('id')
                  elif tag == 'div' and (attrs_dict.get('class') == 'counter' or attrs_dict.get('class') == 'percent'):
                      self.in_value = True

              def handle_endtag(self, tag):
                  if tag == 'div':
                      self.in_value = False

              def handle_data(self, data):
                  data = data.strip()
                  if self.in_value and self.current_id and data:
                      self.data[self.current_id] = data
                      self.in_value = False

          def parse_test_report(html_file):
              """Parse Gradle HTML test report"""
              if not Path(html_file).exists():
                  return None

              with open(html_file, 'r') as f:
                  content = f.read()

              parser = TestReportParser()
              parser.feed(content)

              # Safely parse integer values with error handling
              try:
                  tests = int(parser.data.get('tests', '0'))
                  failures = int(parser.data.get('failures', '0'))
                  ignored = int(parser.data.get('ignored', '0'))
              except (ValueError, TypeError):
                  # If parsing fails, return None to indicate corrupted report
                  return None

              return {
                  'tests': tests,
                  'failures': failures,
                  'ignored': ignored,
                  'duration': parser.data.get('duration', 'N/A'),
                  'success_rate': parser.data.get('successRate', 'N/A')
              }

          def extract_failed_tests(index_html_path):
              """Extract failed test names from HTML class reports in the same directory"""
              failed_tests = []
              # The classes directory is a sibling of the index.html file
              report_dir = Path(index_html_path).parent
              classes_dir = report_dir / 'classes'

              if not classes_dir.exists():
                  return failed_tests

              for class_file in classes_dir.glob('*.html'):
                  try:
                      with open(class_file, 'r') as f:
                          content = f.read()

                      # Find failed test names
                      matches = re.findall(r'<h3 class="failures">([^<]+)</h3>', content)
                      if matches:
                          class_name = class_file.stem
                          for test_name in matches:
                              failed_tests.append(f"{class_name}.{test_name}")
                  except:
                      # Skip files that can't be read
                      pass

              return failed_tests

          modules = {
              'parent-test-results': '📱 Parent App',
              'student-test-results': '📱 Student App',
              'teacher-test-results': '📱 Teacher App',
              'horizon-test-results': '🌅 Horizon',
              'ngc-test-results': '🧩 NGC',
              'instui-test-results': '🎨 InstUI',
              'submodule-test-results': '📦 Submodules'
          }

          print("## 🧪 Unit Test Results\n")

          total_tests = 0
          total_failures = 0
          total_ignored = 0
          all_success = True

          for module_dir, module_name in modules.items():
              report_files = []

              # Search for all index.html files in the downloaded artifacts
              for root, dirs, files in os.walk(f'test-results/{module_dir}'):
                  if 'index.html' in files:
                      report_files.append(os.path.join(root, 'index.html'))

              if not report_files:
                  # Job was skipped, don't show in output
                  continue

              # Aggregate results from all report files (important for submodules)
              module_tests = 0
              module_failures = 0
              module_ignored = 0
              module_duration = 0.0
              failed_to_parse = 0

              for report_file in report_files:
                  result = parse_test_report(report_file)
                  if not result:
                      failed_to_parse += 1
                      continue

                  module_tests += result['tests']
                  module_failures += result['failures']
                  module_ignored += result['ignored']

                  # Parse duration (remove 's' and convert to float)
                  try:
                      duration_str = result['duration'].replace('s', '')
                      module_duration += float(duration_str)
                  except:
                      pass

              if module_tests == 0 and failed_to_parse > 0:
                  # All reports failed to parse
                  print(f"### ⚠️ {module_name}")
                  print(f"- Failed to parse test results ({failed_to_parse} report(s))\n")
                  continue

              # Calculate success rate
              if module_tests > 0:
                  success_rate = f"{((module_tests - module_failures) / module_tests * 100):.0f}%"
              else:
                  success_rate = "N/A"

              total_tests += module_tests
              total_failures += module_failures
              total_ignored += module_ignored

              if module_failures > 0:
                  all_success = False
                  emoji = '❌'
              else:
                  emoji = '✅'

              print(f"### {emoji} {module_name}")
              print(f"- **Tests:** {module_tests} total, {module_failures} failed, {module_ignored} skipped")
              print(f"- **Duration:** {module_duration:.3f}s")
              print(f"- **Success Rate:** {success_rate}")

              # Show failed tests if there are any
              if module_failures > 0:
                  # Extract failed test names from all report files
                  failed_tests = []
                  for report_file in report_files:
                      failed_tests.extend(extract_failed_tests(report_file))

                  if failed_tests:
                      print(f"\n<details>")
                      print(f"<summary>❌ Failed Tests ({len(failed_tests)})</summary>\n")
                      for test in failed_tests:
                          print(f"- `{test}`")
                      print(f"</details>")

              print()

          print("---")
          print(f"### 📊 Summary")
          print(f"- **Total Tests:** {total_tests}")
          print(f"- **Failed:** {total_failures}")
          print(f"- **Skipped:** {total_ignored}")
          if all_success and total_tests > 0:
              print(f"- **Status:** ✅ All tests passed!")
          elif total_tests > 0:
              print(f"- **Status:** ❌ {total_failures} test(s) failed")
          else:
              print(f"- **Status:** ⚠️ No test results found")

          PYTHON_SCRIPT

          set -eo pipefail
          python3 parse_tests.py > test-report.md

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            const marker = '<!-- unit-test-results-comment -->';
            const body = marker + '\n' + report + '\n\n_Last updated: ' + new Date().toUTCString() + '_';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes(marker)
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
              console.log('Updated existing comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('Created new comment');
            }
