name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches-ignore:
      - 'release/student'
      - 'release/teacher'
      - 'release/parent'
  workflow_dispatch:
    inputs:
      record_video:
        description: "Enable FTL video recording (for QA investigation reruns)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

# Private-data env vars consumed by MergePrivateData.kt at build time.
# Every entry is required; missing values fail the build.
env:
  PSPDF_MAVEN_USER: ${{ secrets.PSPDF_MAVEN_USER }}
  PSPDF_MAVEN_PASS: ${{ secrets.PSPDF_MAVEN_PASS }}
  PSPDFKIT_LICENSE_KEY_STUDENT: ${{ secrets.PSPDFKIT_LICENSE_KEY_STUDENT }}
  PSPDFKIT_LICENSE_KEY_TEACHER: ${{ secrets.PSPDFKIT_LICENSE_KEY_TEACHER }}
  CRASHLYTICS_API_KEY: ${{ secrets.CRASHLYTICS_API_KEY }}
  LOGIN_ANONYMOUS_SCHOOL_DOMAIN: ${{ secrets.LOGIN_ANONYMOUS_SCHOOL_DOMAIN }}
  PARENT_LOGIN_CLIENT_ID: ${{ vars.PARENT_LOGIN_CLIENT_ID }}
  PARENT_LOGIN_CLIENT_SECRET: ${{ secrets.PARENT_LOGIN_CLIENT_SECRET }}
  PENDO_ACCESS_TOKEN_PARENT: ${{ secrets.PENDO_ACCESS_TOKEN_PARENT }}
  PENDO_ACCESS_TOKEN_STUDENT: ${{ secrets.PENDO_ACCESS_TOKEN_STUDENT }}
  PENDO_ACCESS_TOKEN_TEACHER: ${{ secrets.PENDO_ACCESS_TOKEN_TEACHER }}
  ROBO_TEST_API_KEY: ${{ secrets.ROBO_TEST_API_KEY }}
  ROBO_TEST_USER_ID: ${{ secrets.ROBO_TEST_USER_ID }}
  ROBO_TEST_USERNAME: ${{ secrets.ROBO_TEST_USERNAME }}
  ROBO_TEST_USER_TOKEN: ${{ secrets.ROBO_TEST_USER_TOKEN }}
  ROBO_TEST_DOMAIN: ${{ secrets.ROBO_TEST_DOMAIN }}
  PRONOUN_TEST_STUDENT: ${{ secrets.PRONOUN_TEST_STUDENT }}
  PRONOUN_TEST_STUDENT_PASSWORD: ${{ secrets.PRONOUN_TEST_STUDENT_PASSWORD }}
  PRONOUN_TEST_TEACHER: ${{ secrets.PRONOUN_TEST_TEACHER }}
  PRONOUN_TEST_TEACHER_PASSWORD: ${{ secrets.PRONOUN_TEST_TEACHER_PASSWORD }}
  PUSH_NOTIF_TEST_STUDENT: ${{ secrets.PUSH_NOTIF_TEST_STUDENT }}
  PUSH_NOTIF_TEST_STUDENT_PASSWORD: ${{ secrets.PUSH_NOTIF_TEST_STUDENT_PASSWORD }}
  PUSH_NOTIF_TEST_TEACHER: ${{ secrets.PUSH_NOTIF_TEST_TEACHER }}
  PUSH_NOTIF_TEST_TEACHER_PASSWORD: ${{ secrets.PUSH_NOTIF_TEST_TEACHER_PASSWORD }}
  GOOGLE_SERVICES_PARENT_B64: ${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}
  GOOGLE_SERVICES_STUDENT_B64: ${{ secrets.GOOGLE_SERVICES_STUDENT_B64 }}
  GOOGLE_SERVICES_TEACHER_B64: ${{ secrets.GOOGLE_SERVICES_TEACHER_B64 }}
  ANALYTICS_XML_STUDENT_B64: ${{ secrets.ANALYTICS_XML_STUDENT_B64 }}
  PRIVATE_STRINGS_XML_STUDENT_B64: ${{ secrets.PRIVATE_STRINGS_XML_STUDENT_B64 }}
  ROBO_USER_JSON_TEACHER_B64: ${{ secrets.ROBO_USER_JSON_TEACHER_B64 }}
  PRIVATE_CONST_KT_B64: ${{ secrets.PRIVATE_CONST_KT_B64 }}

jobs:
  parent-test-apks:
    if: contains(github.event.pull_request.body, 'Parent')
    uses: ./.github/workflows/build-test-apks.yml
    with:
      app-type-lower: parent
    secrets: inherit

  parent-distribute:
    if: contains(github.event.pull_request.body, 'Parent')
    uses: ./.github/workflows/distribute-app.yml
    with:
      app-type: Parent
      app-type-lower: parent
    secrets: inherit

  student-test-apks:
    if: contains(github.event.pull_request.body, 'Student')
    uses: ./.github/workflows/build-test-apks.yml
    with:
      app-type-lower: student
    secrets: inherit

  student-distribute:
    if: contains(github.event.pull_request.body, 'Student')
    uses: ./.github/workflows/distribute-app.yml
    with:
      app-type: Student
      app-type-lower: student
    secrets: inherit

  teacher-test-apks:
    if: contains(github.event.pull_request.body, 'Teacher')
    uses: ./.github/workflows/build-test-apks.yml
    with:
      app-type-lower: teacher
    secrets: inherit

  teacher-distribute:
    if: contains(github.event.pull_request.body, 'Teacher')
    uses: ./.github/workflows/distribute-app.yml
    with:
      app-type: Teacher
      app-type-lower: teacher
    secrets: inherit

  submodule-build-and-test:
    name: submodule-build-and-test
    runs-on: ubuntu-latest-16core
    if: >-
      contains(github.event.pull_request.body, 'Parent') ||
      contains(github.event.pull_request.body, 'Student') ||
      contains(github.event.pull_request.body, 'Teacher')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Building Artifacts
      - name: Build test and app APKs
        run: |
          ./gradle/gradlew -p apps :pandautils:assembleDebugAndroidTest
          mv ./libs/pandautils/build/outputs/apk/androidTest/debug/pandautils-debug-androidTest.apk ./libs/pandautils/pandautils-test.apk
          ./gradle/gradlew -p apps :pandautils:assembleDebugAndroidTest -DtestApplicationId=com.instructure.pandautils
          mv ./libs/pandautils/build/outputs/apk/androidTest/debug/pandautils-debug-androidTest.apk ./libs/pandautils/pandautils-app.apk
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      # Uploading Artifacts to GitHub
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: pandautils-test.apk
          path: libs/pandautils/pandautils-test.apk

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: pandautils-app.apk
          path: libs/pandautils/pandautils-app.apk

  submodule-unit-tests:
    name: submodule-unit-tests
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run submodule unit tests
        run: |
          ./gradle/gradlew -p apps testDebugUnitTest -x :dataseedingapi:test -x :teacher:test -x :student:test -x :ngc:testDebugUnitTest -x :instui:testDebugUnitTest
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload submodule test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submodule-test-results
          path: |
            libs/*/build/reports/tests/testDebugUnitTest/
            libs/*/build/test-results/testDebugUnitTest/
          retention-days: 1

  parent-unit-tests:
    name: parent-unit-tests
    runs-on: ubuntu-latest-16core
    if: contains(github.event.pull_request.body, 'Parent')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :parent:testDevDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload parent test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-test-results
          path: |
            apps/parent/build/reports/tests/testDevDebugUnitTest/
            apps/parent/build/test-results/testDevDebugUnitTest/
          retention-days: 1

  student-unit-tests:
    name: student-unit-tests
    runs-on: ubuntu-latest-16core
    if: contains(github.event.pull_request.body, 'Student')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :student:testDevDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload student test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-test-results
          path: |
            apps/student/build/reports/tests/testDevDebugUnitTest/
            apps/student/build/test-results/testDevDebugUnitTest/
          retention-days: 1

  teacher-unit-tests:
    name: teacher-unit-tests
    runs-on: ubuntu-latest-16core
    if: contains(github.event.pull_request.body, 'Teacher')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :teacher:testDevDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload teacher test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-test-results
          path: |
            apps/teacher/build/reports/tests/testDevDebugUnitTest/
            apps/teacher/build/test-results/testDevDebugUnitTest/
          retention-days: 1

  horizon-unit-tests:
    name: horizon-unit-tests
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    if: contains(github.event.pull_request.body, 'Student')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            .gradle
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :horizon:testDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload horizon test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-test-results
          path: |
            libs/horizon/build/reports/tests/testDebugUnitTest/
            libs/horizon/build/test-results/testDebugUnitTest/
          retention-days: 1

  ngc-unit-tests:
    name: ngc-unit-tests
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            .gradle
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :ngc:testDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload ngc test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngc-test-results
          path: |
            libs/ngc/build/reports/tests/testDebugUnitTest/
            libs/ngc/build/test-results/testDebugUnitTest/
          retention-days: 1

  instui-unit-tests:
    name: instui-unit-tests
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            .gradle
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Run unit tests
        run: |
          ./gradle/gradlew -p apps :instui:testDebugUnitTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload instui test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instui-test-results
          path: |
            libs/instui/build/reports/tests/testDebugUnitTest/
            libs/instui/build/test-results/testDebugUnitTest/
          retention-days: 1

  horizon-test-build:
    name: horizon-test-build
    runs-on: ubuntu-latest-16core
    timeout-minutes: 30
    if: contains(github.event.pull_request.body, 'Student')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            .gradle
          key: ${{ runner.os }}-gradle-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Build Horizon test APK
        run: |
          ./gradle/gradlew -p apps :horizon:assembleDebugAndroidTest \
            --build-cache \
            --parallel \
            --max-workers=4 \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload Horizon test APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-debug-androidTest.apk
          path: libs/horizon/build/outputs/apk/androidTest/debug/horizon-debug-androidTest.apk

  horizon-ui-tests:
    name: horizon-ui-tests
    runs-on: ubuntu-latest-16core
    timeout-minutes: 60
    if: contains(github.event.pull_request.body, 'Student')
    needs: [student-test-apks, horizon-test-build]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --quiet defusedxml

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Setup Service account
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.GCLOUD_KEY }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_KEY}" ]; then
            echo "Error: GCLOUD_KEY secret is not set"
            exit 1
          fi
          echo "${FIREBASE_SERVICE_ACCOUNT_KEY}" > service-account-key.json
          chmod 600 service-account-key.json

      - name: Setup Flank config
        run: |
          cp ./libs/horizon/flank.yml ./flank.yml
          if [ "${{ github.event.inputs.record_video }}" = "true" ]; then
            sed -i 's/^  record-video:.*/  record-video: true/' ./flank.yml
            echo "Video recording enabled for this run"
          fi

      - name: Copy APKs to expected locations
        run: |
          if [ -d "student-qa-debug.apk" ]; then
             mkdir -p apps/student/build/outputs/apk/qa/debug
             mv student-qa-debug.apk/student-qa-debug.apk apps/student/build/outputs/apk/qa/debug/
             rm -rf student-qa-debug.apk
          fi
          if [ -d "horizon-debug-androidTest.apk" ]; then
             mkdir -p libs/horizon/build/outputs/apk/androidTest/debug
             mv horizon-debug-androidTest.apk/horizon-debug-androidTest.apk libs/horizon/build/outputs/apk/androidTest/debug/
             rm -rf horizon-debug-androidTest.apk
          fi

      - name: Download Flank
        run: curl -fL -o flank.jar https://github.com/Flank/flank/releases/download/v23.07.0/flank.jar

      - name: Run Flank UI tests (initial)
        id: flank_initial
        continue-on-error: true
        run: |
          set -o pipefail
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml 2>&1 | tee flank-initial.log
          flank_exit=${PIPESTATUS[0]}
          # Flank v23.07.0 sometimes exits 0 even when matrices fail. Backstop on the log.
          if grep -qE '[1-9][0-9]* matri(x|ces) failed' flank-initial.log; then
            echo "::warning::Flank reported matrix failures despite exit code"
            exit 1
          fi
          exit "$flank_exit"

      - name: Detect failed tests for scoped rerun
        id: detect
        if: steps.flank_initial.outcome == 'failure'
        run: |
          python3 scripts/flank/detect_rerun.py results > rerun-tests.txt || true
          if [ ! -s rerun-tests.txt ]; then
            echo "rerun=none" >> $GITHUB_OUTPUT
            echo "Initial run failed but no candidates identified (job will fail)."
          elif grep -q '__MISSING_SHARDS__' rerun-tests.txt; then
            echo "rerun=full" >> $GITHUB_OUTPUT
            echo "Missing shard(s) detected — full-suite rerun will run."
          else
            echo "rerun=scoped" >> $GITHUB_OUTPUT
            echo "Tests to rerun:"
            cat rerun-tests.txt
          fi

      - name: Move initial results aside
        if: steps.detect.outputs.rerun == 'scoped' || steps.detect.outputs.rerun == 'full'
        run: mv results results-initial

      - name: Build scoped rerun config
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          pip install --quiet pyyaml
          python3 scripts/flank/build_rerun_flank.py ./flank.yml rerun-tests.txt > flank-rerun.yml

      - name: Rerun (scoped to failed tests)
        if: steps.detect.outputs.rerun == 'scoped'
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank-rerun.yml

      - name: Rerun (full suite — missing-shards fallback)
        if: steps.detect.outputs.rerun == 'full'
        run: |
          GOOGLE_APPLICATION_CREDENTIALS=./service-account-key.json java -jar flank.jar android run -c=./flank.yml

      - name: Report initial results to Splunk
        if: always() && (steps.detect.outputs.rerun == 'scoped' || steps.detect.outputs.rerun == 'full')
        run: |
          if [ -d results-initial ] && [ -n "$(ls -A results-initial 2>/dev/null)" ]; then
            ./apps/postProcessTestRun.bash horizon-ui results-initial/$(ls results-initial)
          fi
        env:
          SPLUNK_MOBILE_TOKEN: ${{ secrets.SPLUNK_MOBILE_TOKEN }}
          OBSERVE_MOBILE_TOKEN: ${{ secrets.OBSERVE_MOBILE_TOKEN }}
          BITRISE_TRIGGERED_WORKFLOW_ID: ${{ github.workflow }}
          BITRISE_GIT_BRANCH: ${{ github.ref_name }}
          BITRISE_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Report final results to Splunk
        if: always() && hashFiles('results/**/JUnitReport.xml') != ''
        run: ./apps/postProcessTestRun.bash horizon-ui results/$(ls results)
        env:
          SPLUNK_MOBILE_TOKEN: ${{ secrets.SPLUNK_MOBILE_TOKEN }}
          OBSERVE_MOBILE_TOKEN: ${{ secrets.OBSERVE_MOBILE_TOKEN }}
